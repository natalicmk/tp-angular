<div class="container mt-4">

  <h2 class="text-center mb-4">
    Juego de Memoria
  </h2>

  <div class="text-center mb-4">

    <button
      class="btn btn-success me-2"
      (click)="iniciarJuego()"
    >
      INICIAR
    </button>

    <button
      class="btn btn-danger"
      (click)="reiniciarJuego()"
    >
      REINICIAR
    </button>

  </div>

  <h4 class="text-center">
    Intentos: {{ intentos }}
  </h4>

  <div class="row mt-4">

    @for (carta of cartas; track carta) {

      <div class="col-3 mb-3">

        <div
          class="card p-2"
          (click)="seleccionarCarta(carta)"
          style="cursor:pointer;"
        >

          <img
            [src]="carta.visible || carta.encontrada
            ? 'assets/' + carta.imagen
            : 'assets/tapada.jpg'"
            height="120"
          >

        </div>

      </div>

    }

  </div>

</div>
